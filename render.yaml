services:
  # ── Backend Laravel (Docker)
  - type: web
    name: kerconnect-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_NAME
        value: KerConnect
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://api.kerconnect.naratechvision.com
      - key: FRONTEND_URL
        value: https://kerconnect.naratechvision.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kerconnect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kerconnect-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kerconnect-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kerconnect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kerconnect-db
          property: password
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: KerConnect
      - key: RESEND_KEY
        sync: false
      - key: SESSION_DRIVER
        value: array
      - key: VIEW_COMPILED_PATH
        value: /var/www/html/storage/framework/views
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: public
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Frontend Next.js (natif Node)
  - type: web
    name: kerconnect-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.kerconnect.naratechvision.com/api
      - key: NODE_ENV
        value: production

# ── Base de données PostgreSQL managée
databases:
  - name: kerconnect-db
    plan: free
    databaseName: kerconnect
    user: kerconnect_user
